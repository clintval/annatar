name: publish annatar

on:
  push:
    tags: '[0-9]+.[0-9]+.[0-9]+'

permissions: {}

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  UV_VERSION: 0.12.20
  CARGO_TERM_COLOR: always

jobs:
  on-main-branch-check:
    name: on-main-branch-check
    runs-on: ubuntu-latest
    permissions:
      contents: read  # to check out the repository and its history
    outputs:
      on_main: ${{ steps.contains_tag.outputs.retval }}
    steps:
      - name: Stop following the remote HEAD so the tag check sees every branch
        run: git config --global remote.origin.followRemoteHEAD never

      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check that the tag is on the main branch
        uses: rickstaa/action-contains-tag@a9ff27d505ba2bf074a2ebb48b208e76d35ff308 # v1.2.10
        id: contains_tag
        with:
          reference: "main"
          tag: "${{ github.ref_name }}"

      - name: Check that the tag matches the package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          if [ "$TAG" != "$version" ]; then
            echo "::error::The tag $TAG does not match the version $version in Cargo.toml"
            exit 1
          fi

  tests:
    name: tests
    needs: on-main-branch-check
    if: ${{ needs.on-main-branch-check.outputs.on_main == 'true' }}
    permissions:
      contents: read  # to check out the repository in the called workflow
    uses: ./.github/workflows/ci.yml # zizmor: ignore[self-repository] GitHub does not document $/ for reusable workflows

  build-binaries:
    name: build-binaries (${{ matrix.target }})
    needs: tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read  # to check out the tagged commit
    steps:
      - name: Check out the repository at the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}

      - name: Build the release binary
        run: cargo build --profile dist --locked --target "$TARGET"
        env:
          TARGET: ${{ matrix.target }}

      - name: Package the binary
        env:
          TARGET: ${{ matrix.target }}
          TAG: ${{ github.ref_name }}
        run: |
          name="annatar-$TAG-$TARGET"
          mkdir "$name"
          cp "target/$TARGET/dist/annatar" LICENSE README.md "$name/"
          tar -czf "$name.tar.gz" "$name"

      - name: Upload the archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: annatar-${{ matrix.target }}
          path: annatar-*.tar.gz
          if-no-files-found: error

  build-distributions:
    name: build-distributions
    needs: tests
    permissions:
      contents: read  # to check out the repository in the called workflow
    uses: ./.github/workflows/wheels.yml # zizmor: ignore[self-repository] GitHub does not document $/ for reusable workflows

  check-distributions:
    name: check-distributions
    needs: build-distributions
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Download the distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: python-*
          path: dist/
          merge-multiple: true

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: "false"

      - name: Check the package metadata
        run: |
          ls -l dist/
          uv run --no-project --with twine twine check --strict dist/*

  publish-to-pypi:
    name: publish-to-pypi
    runs-on: ubuntu-latest
    needs: [build-binaries, check-distributions]
    environment: pypi
    permissions:
      id-token: write  # to publish to PyPI as a trusted publisher
    steps:
      - name: Download the distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: python-*
          path: dist/
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          skip-existing: true
          print-hash: true
          verbose: true

  make-changelog:
    name: make-changelog
    runs-on: ubuntu-latest
    needs: publish-to-pypi
    permissions:
      contents: read  # to check out the tagged commit and its history
    outputs:
      release_body: ${{ steps.git-cliff.outputs.content }}
    steps:
      - name: Check out the repository at the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
          persist-credentials: false

      - name: Generate a changelog
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        id: git-cliff
        with:
          config: Cargo.toml
          args: --latest --verbose
        env:
          GITHUB_REPO: ${{ github.repository }}

  make-github-release:
    name: make-github-release
    runs-on: ubuntu-latest
    environment: github
    permissions:
      contents: write  # to create the GitHub release
    needs: [build-binaries, make-changelog]
    steps:
      - name: Download the archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: annatar-*
          path: archives
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          NOTES: ${{ needs.make-changelog.outputs.release_body }}
        run: gh release create "$TAG" archives/*.tar.gz --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes "$NOTES"
