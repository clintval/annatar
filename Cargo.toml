[package]
name = "annatar"
version = "0.1.0"
authors = ["Clint Valentine <valentine.clint@gmail.com>"]
edition = "2024"
rust-version = "1.92"
license = "MIT"
readme = "README.md"
repository = "https://github.com/clintval/annatar"
description = "Convert a multi-sample VCF of single cells into an AnnData h5ad."
categories = ["command-line-utilities", "science"]
keywords = ["bioinformatics", "VCF", "single-cell", "AnnData", "VEP"]
publish = false
exclude = [".github/", "pixi.lock", "pixi.toml"]

[profile.release]
codegen-units = 16
lto = "thin"

[profile.dist]
inherits = "release"
codegen-units = 1
lto = "fat"
debug = 0
incremental = false
strip = true

[lib]
name = "annatar"
path = "src/lib/mod.rs"

[[bin]]
name = "annatar"
path = "src/main.rs"
required-features = ["cli"]

[[test]]
name = "cli"
required-features = ["cli"]

[features]
default = ["cli"]
cli = [
    "dep:anndata",
    "dep:anndata-hdf5",
    "dep:clap",
    "dep:env_logger",
    "dep:ndarray",
    "dep:polars",
]
python = ["dep:numpy", "dep:pyo3"]

[dependencies]
anndata = { version = "0.8", optional = true }
anndata-hdf5 = { version = "0.5", optional = true }
anyhow = "1"
clap = { version = "4", features = ["derive", "wrap_help"], optional = true }
env_logger = { version = "0.11", optional = true }
flate2 = "1"
log = "0.4"
nalgebra-sparse = "0.11"
ndarray = { version = "0.17", optional = true }
noodles = { version = "0.116", features = ["bcf", "bgzf", "core", "vcf"] }
noodles-bgzf = { version = "0.51", features = ["libdeflate"] }
numpy = { version = "0.29", optional = true }
percent-encoding = "2.3.2"
polars = { version = "0.55", default-features = false, features = ["dtype-categorical"], optional = true }
pyo3 = { version = "0.29", features = ["abi3-py311"], optional = true }
sha2 = "0.11"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
rstest = "0.28.0"
tempfile = "3"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tarpaulin_include)'] }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
similar_names = "allow"

[package.metadata.git-cliff.changelog]
header = ""
trim = true
body = """
{% for group, commits in commits | group_by(attribute="group") %}
    ## {{ group | upper_first }}
    {% for commit in commits %}
        - {{ commit.message | upper_first }} ({{ commit.id | truncate(length=8, end="") }})\
    {% endfor %}
{% endfor %}\n
"""

[package.metadata.git-cliff.git]
conventional_commits = true
commit_parsers = [
    { message = "^[a-z]+(\\(.+\\))?!:", group = "Breaking" },
    { message = "^security*", group = "Security" },
    { message = "^feat*", group = "Features" },
    { message = "^fix*", group = "Bug Fixes" },
    { message = "^docs*", group = "Documentation" },
    { message = "^perf*", group = "Performance" },
    { message = "^refactor*", group = "Refactor" },
    { message = "^style*", group = "Styling" },
    { message = "^test*", group = "Testing" },
    { message = "^build*", group = "Build" },
    { message = "^ci", group = "Continuous Integration" },
    { message = "^revert*", group = "Reverts" },
    { message = "^chore\\(release\\):*", skip = true },
    { message = "^chore\\(deps\\)", skip = true },
    { message = "^chore*", group = "Miscellaneous Tasks" },
    { body = ".*security", group = "Security" },
]
filter_commits = false
