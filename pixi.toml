[workspace]
authors = ["clintval <valentine.clint@gmail.com>"]
channels = ["conda-forge", "bioconda"]
name = "annatar"
platforms = ["linux-64", "osx-64", "osx-arm64"]
version = "0.1.0"

[tasks]
test = { cmd = "cargo test --all --no-fail-fast", env = { CARGO_BUILD_JOBS = "4" } }
fmt = "cargo fmt"
fmt-check = "cargo fmt -- --check"
lint = { cmd = "cargo clippy --all-targets --all-features -- -D warnings", env = { CARGO_BUILD_JOBS = "4" } }
develop = { cmd = "maturin develop --release", env = { CARGO_BUILD_JOBS = "4" } }
test-readback = { cmd = "pytest tests/python", depends-on = ["develop"] }
lint-python = "ruff format --check && ruff check && mypy"

[dependencies]
anndata = ">=0.10"
bcftools = "1.24"
htslib = "*"
mudata = ">=0.3"
pytest = "*"
python = "3.12.*"
rust = ">=1.92"
scanpy = "*"
maturin = ">=1.15,<2"
pip = ">=26.2.2,<27"
ruff = ">=0.17.3,<0.18"
mypy = ">=2.4.1,<3"

[target.linux-64.dependencies]
c-compiler = "*"

[target.linux-64.activation.env]
CC = "gcc"
