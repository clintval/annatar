[project]
name = "annatar"
dynamic = ["version"]
description = "Convert a multi-sample VCF of single cells into an AnnData h5ad."
authors = [{ name = "Clint Valentine", email = "valentine.clint@gmail.com" }]
license = "MIT"
readme = "README.md"
keywords = ["bioinformatics", "VCF", "single-cell", "AnnData", "VEP"]
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    # anndata before 0.12.7 accepts pandas 3 but cannot write an h5ad under it.
    "anndata >=0.12.7",
    "numpy >=1.26",
    "pandas >=2.2",
    "scipy >=1.13",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Typing :: Typed",
]

[project.urls]
"homepage" = "https://github.com/clintval/annatar"
"repository" = "https://github.com/clintval/annatar"
"Bug Tracker" = "https://github.com/clintval/annatar/issues"

[project.scripts]
annatar = "annatar._cli:main"

[build-system]
requires      = ["maturin>=1.15,<2"]
build-backend = "maturin"

[tool.maturin]
python-source = "python"
module-name   = "annatar._native"
features      = ["python"]
include       = [
    { path = "CONTRIBUTING.md", format = "sdist" },
    { path = "tests/**/*", format = "sdist" },
]
exclude       = [
    { path = "tests/**/__pycache__/**/*", format = "sdist" },
    { path = "tests/python/out/**/*", format = "sdist" },
]

[tool.ruff]
include        = ["python/**/*.py", "tests/python/*.py", "docs/example/*.py", ".github/smoke.py"]
exclude        = ["tests/python/test_readback.py"]
src            = [".", "python"]
line-length    = 100
target-version = "py311"
output-format  = "full"
preview        = true

[tool.ruff.lint]
select    = ["A", "ARG", "C901", "B", "D", "D204", "E", "LOG", "F", "I", "N", "W", "Q"]
ignore    = ["E203", "E701", "D213", "D100", "D104"]
unfixable = ["B"]
preview   = true

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.ruff.lint.isort]
force-single-line = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
files             = ["python/"]
strict            = true
warn_unreachable  = true
enable_error_code = ["ignore-without-code", "possibly-undefined"]

[[tool.mypy.overrides]]
module = ["pandas.*", "scipy.*"]
ignore_missing_imports = true
